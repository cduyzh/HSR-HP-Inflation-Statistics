[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/local-cache/*"
  to = "https://hsr-data-hub.netlify.app/local-cache/:splat"
  status = 200
  # 数据中心尚未发布对应文件时，先使用 dist/local-cache 内的离线副本。
  force = false

[[redirects]]
  from = "/assets/hsr/*"
  to = "https://hsr-data-hub.netlify.app/assets/hsr/:splat"
  status = 200
  # 与 JSON 保持相同的静态文件优先策略，避免上游 404 遮蔽已打包图片。
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
